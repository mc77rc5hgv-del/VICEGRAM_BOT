name: VOLNA core
on:
  push:
    paths: ['volna-core/**', '.github/workflows/volna-core.yml']
  pull_request:
    paths: ['volna-core/**', '.github/workflows/volna-core.yml']
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test --manifest-path volna-core/Cargo.toml
      - run: python3 volna-core/tests/socks_fixture.py
      - run: python3 volna-core/tests/hysteria_fixture.py
      - run: cargo clippy --manifest-path volna-core/Cargo.toml --all-targets -- -D warnings
